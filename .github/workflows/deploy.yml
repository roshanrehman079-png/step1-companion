# Every push to main: run tests, build, publish to GitHub Pages.
name: Test and deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Both values are public by design (the publishable key only works with row-level security).
      VITE_SUPABASE_URL: https://gbyjwfaprhfxjknslivu.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ztBTqsRxklH5hnoK3fxYXw_fNsMWiV1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
